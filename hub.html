
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игровой хаб ⭐</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.hub {
    width: 90%;
    max-width: 500px;
    padding: 40px 25px;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.15);
}

h1 {
    color: white;
    font-size: 36px;
    margin-bottom: 10px;
}

.subtitle {
    color: white;
    font-size: 18px;
    margin-bottom: 30px;
}

.game-card {
    background: white;
    padding: 25px;
    border-radius: 20px;
}

.game-icon {
    font-size: 75px;
    margin-bottom: 10px;
}

.game-card h2 {
    color: #ff69b4;
}

.game-card p {
    color: #777;
    font-size: 16px;
}

button {
    background: #ff69b4;
    color: white;
    border: none;
    border-radius: 15px;
    padding: 16px 35px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.3s;
}

button:hover {
    background: #ff1493;
    transform: scale(1.07);
}

footer {
    color: white;
    margin-top: 25px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="hub">

    <h1>⭐ Игровой хаб ⭐</h1>

    <p class="subtitle">
        Добро пожаловать в мир игр!
    </p>

    <div class="game-card">

        <div class="game-icon">🌟</div>

        <h2>Поймай звёздочку!</h2>

        <p>
            Лови звёздочки за 30 секунд
            и набирай как можно больше очков!
        </p>

        <button onclick="location.href='index.html'">
            🎮 Играть
        </button>

    </div>

    <footer>
        © 2026 Мой игровой хаб
    </footer>

</div>

</body>
</html>
